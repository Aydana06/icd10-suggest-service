# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Spring Application Name
spring.application.name=ICD-10 Diagnosis Service

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_db
spring.datasource.username=postgres
spring.datasource.password=PAydana0227#
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# API Documentation (Swagger/OpenAPI)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# External API Configuration
icd10.api.url=http://localhost:8082/api/icd10
icd10.api.timeout=5000

# Logging
logging.level.root=INFO
logging.level.mn.hospital=DEBUG

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5500}

app.admin.api-key=${ADMIN_API_KEY:}

app.ui.desktop.enabled=${DESKTOP_UI_ENABLED:false}